build:
  maxIssues: 0

complexity:
  LongMethod:
    threshold: 40
  LongParameterList:
    functionThreshold: 8
    constructorThreshold: 10
  CyclomaticComplexMethod:
    threshold: 15
  TooManyFunctions:
    active: false
  NestedBlockDepth:
    threshold: 5

style:
  MagicNumber:
    active: true
    ignoreNumbers: ['-1', '0', '1', '2', '3', '4']
    ignorePropertyDeclaration: true
    ignoreConstantDeclaration: true
    ignoreCompanionObjectPropertyDeclaration: true
    excludes: ['**/test/**', '**/androidTest/**']
  MaxLineLength:
    maxLineLength: 120
  ReturnCount:
    max: 5
  WildcardImport:
    active: true
  UnusedPrivateMember:
    active: true

performance:
  SpreadOperator:
    active: true
